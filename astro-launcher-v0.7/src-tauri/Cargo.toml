[package]
name = "astro-launcher"
version = "0.7.0"
description = "Astro Launcher - Minecraft launcher"
authors = ["Astro Launcher"]
edition = "2021"

[lib]
name = "astro_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls"
] }

tokio = { version = "1", features = [
    "fs",
    "io-util",
    "rt-multi-thread"
] }

sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"

zip = "2"
regex = "1"
dirs = "6"
