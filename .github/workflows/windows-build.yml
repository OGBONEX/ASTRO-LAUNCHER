name: Build Astro Launcher for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: astro-launcher-v0.7/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci
        working-directory: astro-launcher-v0.7

      - name: Build frontend
        run: npm run build
        working-directory: astro-launcher-v0.7

      - name: Build Tauri application
        run: npm run tauri build
        working-directory: astro-launcher-v0.7

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Astro-Launcher-Windows
          path: |
            astro-launcher-v0.7/src-tauri/target/release/bundle/nsis/*.exe
            astro-launcher-v0.7/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
